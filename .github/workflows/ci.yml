name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (.NET) — restore / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DudaPelasLentes.slnx

      - name: Build
        run: dotnet build DudaPelasLentes.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DudaPelasLentes.slnx --configuration Release --no-build --verbosity normal

  web:
    name: Web (React) — ci / lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duda-pelas-lentes-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: duda-pelas-lentes-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
